# Each language carries its strings twice through a YAML anchor: the flat
# PLUGIN_AI_LABEL block that Twig and PHP translate() read, and the ICU block
# that Admin2 looks up first.
en:
  PLUGIN_AI_LABEL: &en
    LABEL_GENERATED: 'AI generated'
    LABEL_ALTERED: 'AI altered'
    META_FIELD: 'AI content (none, altered or generated)'
    STATUS_NONE: 'No AI used'
    STATUS_ALTERED: 'AI altered'
    STATUS_GENERATED: 'AI generated'
    SECTION_WORDING: 'Label wording'
    LABEL_GENERATED_TEXT: 'Label for AI generated images'
    LABEL_ALTERED_TEXT: 'Label for AI altered images'
    LABEL_TEXT_HELP: 'Leave empty for the translated default. Plain text, or a translation key from user/languages to use a different wording per language.'
    SECTION_DESIGN: 'Design'
    POSITION: 'Default position'
    POSITION_HELP: 'Used when the <code>ai_label</code> filter is not given a position.'
    TOP_LEFT: 'Top left'
    TOP_CENTER: 'Top center'
    TOP_RIGHT: 'Top right'
    CENTER_LEFT: 'Center left'
    CENTER: 'Center'
    CENTER_RIGHT: 'Center right'
    BOTTOM_LEFT: 'Bottom left'
    BOTTOM_CENTER: 'Bottom center'
    BOTTOM_RIGHT: 'Bottom right'
    SIZE: 'Largest size (% of the image)'
    SIZE_HELP: 'The label never takes more than this share of the image width or height. On small images it shrinks to fit.'
    FONT_SIZE: 'Text size (px)'
    FONT_SIZE_HELP: 'The largest the text is drawn. The label is never scaled up beyond this size.'
    TEXT_COLOR: 'Text color'
    BACKGROUND_COLOR: 'Background color'
    BACKGROUND_OPACITY: 'Background opacity (%)'
    BACKGROUND_OPACITY_HELP: '0 for no background, 100 for a solid one.'
    PADDING: 'Padding (px)'
    PADDING_HELP: 'Space around the text inside the label.'
    MARGIN: 'Margin (px)'
    MARGIN_HELP: 'Space between the label and the edge of the image.'
    RADIUS: 'Corner radius (px)'
    ICON: 'Icon'
    ICON_HELP: '<code>sparkle</code> for the built-in icon, <code>none</code> for no icon, or an image such as <code>user://images/ai-icon.png</code>.'
    FONT: 'Font'
    FONT_HELP: 'A TrueType font such as <code>user://fonts/MyFont.ttf</code>. Leave empty for the bundled DejaVu Sans Bold, which covers Latin, Greek, Cyrillic and Hebrew.'
    SECTION_ADMIN: 'Admin'
    ADMIN_FIELD: 'AI field in the media editor'
    ADMIN_FIELD_HELP: 'Adds an AI content field to the media metadata editor in Admin2. It is saved as <code>ai_status</code> in the image''s .meta.yaml file.'
  ICU:
    PLUGIN_AI_LABEL: *en

de:
  PLUGIN_AI_LABEL: &de
    LABEL_GENERATED: 'KI-generiert'
    LABEL_ALTERED: 'KI-bearbeitet'
    META_FIELD: 'KI-Inhalt (none, altered oder generated)'
    STATUS_NONE: 'Keine KI verwendet'
    STATUS_ALTERED: 'KI-bearbeitet'
    STATUS_GENERATED: 'KI-generiert'
    SECTION_WORDING: 'Text des Hinweises'
    LABEL_GENERATED_TEXT: 'Hinweis für KI-generierte Bilder'
    LABEL_ALTERED_TEXT: 'Hinweis für KI-bearbeitete Bilder'
    LABEL_TEXT_HELP: 'Leer lassen für den übersetzten Standardtext. Freier Text oder ein Übersetzungsschlüssel aus user/languages für einen eigenen Text je Sprache.'
    SECTION_DESIGN: 'Gestaltung'
    POSITION: 'Standardposition'
    POSITION_HELP: 'Gilt, wenn dem Filter <code>ai_label</code> keine Position übergeben wird.'
    TOP_LEFT: 'Oben links'
    TOP_CENTER: 'Oben mittig'
    TOP_RIGHT: 'Oben rechts'
    CENTER_LEFT: 'Mitte links'
    CENTER: 'Mitte'
    CENTER_RIGHT: 'Mitte rechts'
    BOTTOM_LEFT: 'Unten links'
    BOTTOM_CENTER: 'Unten mittig'
    BOTTOM_RIGHT: 'Unten rechts'
    SIZE: 'Maximale Größe (% des Bildes)'
    SIZE_HELP: 'Der Hinweis nimmt nie mehr als diesen Anteil der Bildbreite oder -höhe ein. Auf kleinen Bildern wird er verkleinert.'
    FONT_SIZE: 'Schriftgröße (px)'
    FONT_SIZE_HELP: 'Die größte Schriftgröße. Der Hinweis wird nie darüber hinaus vergrößert.'
    TEXT_COLOR: 'Textfarbe'
    BACKGROUND_COLOR: 'Hintergrundfarbe'
    BACKGROUND_OPACITY: 'Deckkraft des Hintergrunds (%)'
    BACKGROUND_OPACITY_HELP: '0 für keinen Hintergrund, 100 für einen deckenden.'
    PADDING: 'Innenabstand (px)'
    PADDING_HELP: 'Abstand zwischen Text und Rand des Hinweises.'
    MARGIN: 'Außenabstand (px)'
    MARGIN_HELP: 'Abstand zwischen Hinweis und Bildrand.'
    RADIUS: 'Eckenradius (px)'
    ICON: 'Symbol'
    ICON_HELP: '<code>sparkle</code> für das eingebaute Symbol, <code>none</code> für kein Symbol, oder ein Bild wie <code>user://images/ai-icon.png</code>.'
    FONT: 'Schriftart'
    FONT_HELP: 'Eine TrueType-Schrift wie <code>user://fonts/MyFont.ttf</code>. Leer lassen für die mitgelieferte DejaVu Sans Bold, die Latein, Griechisch, Kyrillisch und Hebräisch abdeckt.'
    SECTION_ADMIN: 'Admin'
    ADMIN_FIELD: 'KI-Feld im Medien-Editor'
    ADMIN_FIELD_HELP: 'Fügt dem Metadaten-Editor für Medien in Admin2 ein Feld für KI-Inhalte hinzu. Es wird als <code>ai_status</code> in der .meta.yaml-Datei des Bildes gespeichert.'
  ICU:
    PLUGIN_AI_LABEL: *de
